version: '3'

includes:
  automation-file:
    taskfile: ../../automation/Taskfile.yml
    internal: true
    vars:
      ENV_DIR: '{{.ROOT_DIR}}'
      DEPLOYMENT_FILE: '{{.ROOT_DIR}}/deployment.yml'
      QUARTER: '{{.QUARTER}}'

tasks:
  validate:
    desc: "Validate deployment configuration for completeness and correctness"
    cmds:
      - task: automation-file:validate

  #--------------------------------------------------------------------------
  # Full Stack Deployments
  #--------------------------------------------------------------------------
  basekit:deploy:
    desc: "Deploy base infrastructure (VMs, networking, OPNsense)"
    cmds:
      - task: automation-file:nodeprep:ssh-timeout:relax
      - task: opnsense:deploy
      - task: mcm:vm:deploy
      - task: osms:vm:deploy
      - task: mcm:cluster:deploy
      - task: osms:cluster:deploy
      - task: osdc:cluster:deploy
      - task: automation-file:nodeprep:ssh-timeout:restore

  #--------------------------------------------------------------------------
  # NodePrep Lifecycle Workflows
  #--------------------------------------------------------------------------
  nodeprep:run:
    desc: "Run node preparation, prompting for HOSTS if not provided"
    preconditions:
      - sh: '[ -n "{{.HOSTS}}" ]'
        msg: "ERROR: HOSTS variable is required. Usage: task nodeprep:run HOSTS=mcm1,osms-clusters"
    cmds:
      - task: automation-file:nodeprep:run
        vars:
          HOSTS: "{{.HOSTS}}"

  vm:libvirt:deploy:
    desc: "Deploy VMs on Management KVM, prompting for HOSTS if not provided"
    preconditions:
      - sh: '[ -n "{{.VM}}" ]'
        msg: "ERROR: VM variable is required. Usage: task vm:libvirt:deploy VM=vm1,vm2"
    cmds:
      - task: automation-file:vm:libvirt:deploy
        vars:
          VM: "{{.VM}}"

  #--------------------------------------------------------------------------
  # MCM Lifecycle Workflows
  #--------------------------------------------------------------------------
  mcm:deploy:
    desc: "Deploy Management Cluster (RKE2, Rancher, Harbor, GitOps)"
    cmds:
      - task: nodeprep:run
        vars:
          HOSTS: mcm-clusters
      - task: automation-file:onboarder:deploy

  #mcm:destroy:
  #  desc: "Destroy Management Cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: mcm-clusters

  mcm:vm:deploy:
    desc: "Deploy Management Cluster VMs on Management KVM"
    vars:
      HOSTS: mcm-clusters
    cmds:
      - task: vm:libvirt:deploy
        vars:
          VM: "mcm1"

  #mcm:vm:destroy:
  #  desc: "Destroy Management Cluster VMs on Management KVM"
  #  vars:
  #    HOSTS: role_mcm
  #  cmds:
  #    - task: vms:libvirt:destroy

  mcm:kubeconfig:get:
    desc: "Retrieve MCM kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: mcm

  #--------------------------------------------------------------------------
  # OSMS Lifecycle Workflows
  #--------------------------------------------------------------------------
  osms:deploy:
    desc: "Deploy OpenSpace Management System cluster"
    cmds:
      - task: nodeprep:run
        vars:
          HOSTS: osms-clusters
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms

  #osms:destroy:
  #  desc: "Destroy OpenSpace Management System cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: role_osms

  osms:vm:deploy:
    desc: "Deploy OpenSpace Management System VMs on Management KVM"
    vars:
      HOSTS: osms-clusters
    cmds:
      - task: vm:libvirt:deploy
        vars:
          HOSTS: "{{.HOSTS}}"

  #osms:vm:destroy:
  #  desc: "Destroy OpenSpace Management System VMs on Management KVM"
  #  vars:
  #    HOSTS: role_osms
  #  cmds:
  #    - task: vms:libvirt:destroy

  osms:kubeconfig:get:
    desc: "Retrieve OSMS kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osms

  #--------------------------------------------------------------------------
  # OSDC Lifecycle Workflows
  #--------------------------------------------------------------------------
  osdc:deploy:
    desc: "Deploy OpenSpace Data Cluster"
    cmds:
      - task: run-node-prep
        vars:
          HOSTS: osdc-clusters
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc
      - task: deploy-post-osdc
        vars:
          HOSTS: osdc-clusters

  #osdc:destroy:
  #  desc: "Destroy OpenSpace Data Cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: role_osdc

  osdc:kubeconfig:get:
    desc: "Retrieve OSDC kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osdc

  #--------------------------------------------------------------------------
  # Cluster Lifecycle Workflows
  #--------------------------------------------------------------------------
  cluster:deploy:
    desc: "Deploy any downstream cluster"
    preconditions:
      - sh: '[ -n "{{.CLUSTER_TYPE}}" ]'
        msg: "ERROR: CLUSTER_TYPE variable is required. Usage: task cluster:deploy CLUSTER_TYPE=osms"
    cmds:
      - task: automation-file:clusters:deploy

  #--------------------------------------------------------------------------
  # OpnSense Lifecycle Workflows
  #--------------------------------------------------------------------------
  opnsense:deploy:
    desc: Deploy OPNsense VM on Management KVM
    cmds:
      - task: automation-file:opnsense:deploy

  #--------------------------------------------------------------------------
  # Updates Workflows
  #--------------------------------------------------------------------------
  update:lifecycle:
    desc: "Update the OpenSpace LifeCycle Manager to latest version"
    cmds:
      - task: automation-file:update:lifecycle

  update:patch:system:
    desc: "Update vulnerability findings to the latest for the quarter"
    cmds:
      - task: automation-file:update:lifecycle
