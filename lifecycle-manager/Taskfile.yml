version: '3'

includes:
  main:
    taskfile: ./automation/Taskfile.yml
    internal: true
    vars:
      ENV_DIR: '{{.TASKFILE_DIR}}'
      DEPLOYMENT_FILE: '{{.ENV_DIR}}/deployment.yml'
      GENERATED_DIR: '{{.ENV_DIR}}/generated'
      INVENTORY: '{{.GENERATED_DIR}}/inventory.ini'

tasks:
  init:
    desc: "Generate + validate from deployment.yml"
    cmds:
      - task: main:init

  validate:
    desc: "Validate deployment configuration for completeness and correctness"
    cmds:
      - task: main:validate

  #--------------------------------------------------------------------------
  # Full Stack Deployments
  #--------------------------------------------------------------------------
  basekit:deploy:
    desc: "Deploy base infrastructure (VMs, networking, OPNsense)"
    cmds:
      - task: main:init
      - task: main:run-nodeprep
        vars: 
          HOSTS: primary_management_host
      - task: opnsense:deploy
      - task: mcm-vm:deploy
      - task: osms-vm:deploy
      - task: mcm:deploy
      - task: osms:deploy
      - task: osdc:deploy

  #--------------------------------------------------------------------------
  # MCM Lifecycle Workflows
  #--------------------------------------------------------------------------
  mcm:deploy:
    desc: "Deploy Management Cluster (RKE2, Rancher, Harbor, GitOps)"
    cmds:
      - task: nodeprep:run
        vars:
          HOSTS: management_cluster
      - task: onboarder:prep
      - task: onboarder:rke2:deploy
      - task: onboarder:harbor:deploy
      - task: onboarder:rancher:deploy
      - task: onboarder:gitea:deploy
      - task: onboarder:argocd:deploy

  #cluster:mcm:destroy:
  #  desc: "Destroy Management Cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: management_cluster

  mcm:vm:deploy:
    desc: "Deploy Management Cluster VMs on Management KVM"
    vars:
      HOSTS: management_cluster
    cmds:
      - task: vms:libvirt:deploy

  #vm:mcm:destroy:
  #  desc: "Destroy Management Cluster VMs on Management KVM"
  #  vars:
  #    HOSTS: management_cluster
  #  cmds:
  #    - task: vms:libvirt:destroy

  mcm:kubeconfig:get:
    desc: "Retrieve MCM kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: mcm

  #--------------------------------------------------------------------------
  # OSMS Lifecycle Workflows
  #--------------------------------------------------------------------------
  osms:deploy:
    desc: "Deploy OpenSpace Management System cluster"
    cmds:
      - task: nodeprep:run
        vars:
          HOSTS: openspace_management_system
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms

  #cluster:osms:destroy:
  #  desc: "Destroy OpenSpace Management System cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: openspace_management_system

  osms:vm:deploy:
    desc: "Deploy OpenSpace Management System VMs on Management KVM"
    vars:
      HOSTS: openspace_management_system
    cmds:
      - task: vms:libvirt:deploy

  #vm:osms:destroy:
  #  desc: "Destroy OpenSpace Management System VMs on Management KVM"
  #  vars:
  #    HOSTS: openspace_management_system
  #  cmds:
  #    - task: vms:libvirt:destroy

  osms:kubeconfig:get:
    desc: "Retrieve OSMS kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osms

  #--------------------------------------------------------------------------
  # OSDC Lifecycle Workflows
  #--------------------------------------------------------------------------
  osdc:deploy:
    desc: "Deploy OpenSpace Data Cluster"
    cmds:
      - task: run-node-prep
        vars:
          HOSTS: openspace_datapath_cluster
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc
      - task: deploy-post-osdc
        vars:
          HOSTS: openspace_datapath_cluster

  #cluster:osdc:destroy:
  #  desc: "Destroy OpenSpace Data Cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: openspace_datapath_cluster

  osdc:kubeconfig:get:
    desc: "Retrieve OSDC kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osdc