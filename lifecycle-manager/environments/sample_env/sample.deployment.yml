# OpenSpace LifeCycle Manager - Deployment Configuration (v1)
# Single-file, human-friendly, domain-first (implementation details are generated)

metadata:
  name: GEP1
  type: basekit
  versions:
    openspace_lifecycle_manager: "1.2.0"
    onboarder: "3.5.0-rc7"
    osms_tooling: "1.8.x"

access:
  # How automation logs into servers (applies everywhere unless overridden)
  ssh_user: kratos
  ssh_password: kratos

site:
  domain_name: gep1.kratos

services:
  ntp:
    servers: [192.168.2.100]
    timezone: Etc/UTC

networks:
  customer:
    description: Customer/WAN network (external)
    cidr: 10.243.76.0/23
    gateway: 10.243.76.1
    dns_servers: [10.243.25.50, 10.243.25.53]

  management:
    description: Management network (internal cluster)
    cidr: 192.168.2.0/24
    gateway: 192.168.2.1
    dns_servers: [192.168.2.1]

  idrac:
    description: iDRAC out-of-band network (BMC/OOB)
    cidr: 192.168.0.0/24
    gateway: 192.168.0.1

optional:
  nfs:
    enabled: false
    server: 192.168.2.100
    path: /exports/openspace

  opnsense_vm:
    mgmt_ip: 192.168.2.1
    wan_ip: 10.243.77.71

# -----------------------------------------------------------------------------
# MANAGEMENT HOSTS (control hosts; priority: primary is the orchestration host)
# -----------------------------------------------------------------------------
management:
  description: Management Hosts For OpenSpace System
  group_vars: {}

  hosts:
    mgmt-kvm:
      description: Primary Management Host
      host_type: baremetal
      role: basekit
      priority: primary
      
      # Per-network IP assignment.
      networks:
        connect_via: customer
        customer:
          ip: 10.243.77.70
          attach_to: br-wan
        management:
          ip: 192.168.2.6
          attach_to: br-mgmt
        idrac:
          ip: 192.168.0.4
          attach_to: ens3f0

      # nmcli topology
      networking:
        connections:
          br-wan:
            type: bridge
            members: ["eno12409"]

          br-mgmt:
            type: bridge
            members: ["eno12399"]

          ens3f0:
            type: ethernet
            members: ["ens3f0"]

          eno8303:
            type: ethernet
            members: ["eno8303"]
      
      host_vars: {}
      labels: {}

# -----------------------------------------------------------------------------
# CLUSTERS
# -----------------------------------------------------------------------------
clusters:
  local:
    description: Local Management Cluster
    role: mcm
    group_vars:
      ssh_key: rancher_ssh_key

    nodes:
      mcm1:
        description: MCM node
        host_type: vm

        networks:
          connect_via: management
          management:
            ip: 192.168.2.8
            attach_to: enp1s0
          idrac:
            ip: 192.168.0.8
            mode: oob

        networking:
          connections:
            enp1s0:
              type: ethernet
              members: ["enp1s0"]

        host_vars:
          vm:
            memory_mb: 16384
            vcpus: 8
            disk_gb: 500
            backing_store: /var/lib/libvirt/config/images/9_5_hardened_image_vm.qcow2
            os_variant: rhel9.5
            network_bridge: br-mgmt

        labels: {}

  openspace-osms:
    description: Downstream OSMS cluster
    role: osms
    group_vars:
      ssh_key: osms_ssh_key

    nodes:
      osms1:
        description: OSMS node
        host_type: vm

        networks:
          connect_via: management
          management:
            ip: 192.168.2.9
            attach_to: enp1s0
          idrac:
            ip: 192.168.0.9
            mode: oob

        networking:
          connections:
            enp1s0:
              type: ethernet
              members: ["enp1s0"]

        host_vars:
          vm:
            memory_mb: 32768
            vcpus: 16
            disk_gb: 600
            backing_store: /var/lib/libvirt/config/images/9_5_hardened_image_vm.qcow2
            os_variant: rhel9.5
            network_bridge: br-mgmt

        labels: {}

  openspace-osdc:
    description: Downstream OSDC cluster
    role: osdc
    group_vars:
      ssh_key: osdc_ssh_key

    nodes:
      osdc1:
        description: OSDC node
        host_type: baremetal

        networks:
          connect_via: management
          management:
            ip: 192.168.2.16
            attach_to: enp1s0
          idrac:
            ip: 192.168.0.16
            mode: oob

        networking:
          connections:
            enp1s0:
              type: ethernet
              members: ["enp1s0"]

        host_vars:
          mac_address: "30:3E:A7:2E:3A:8B"

        labels: {}

      osdc2:
        description: OSDC node
        host_type: baremetal

        networks:
          connect_via: management
          management:
            ip: 192.168.2.17
            attach_to: enp1s0
          idrac:
            ip: 192.168.0.17
            mode: oob

        networking:
          connections:
            enp1s0:
              type: ethernet
              members: ["enp1s0"]

        host_vars:
          mac_address: "30:3E:A7:2E:3A:8C"

        labels: {}
