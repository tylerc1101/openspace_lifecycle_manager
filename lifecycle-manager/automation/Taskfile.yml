version: '3'

vars:
  ENV_DIR: '{{.ENV_DIR | default .TASKFILE_DIR}}'
  DEPLOYMENT_FILE: '{{.ENV_DIR}}/deployment.yml'
  GENERATED_DIR: '{{.ENV_DIR}}/generated'
  INVENTORY: '{{.GENERATED_DIR}}/inventory.ini'

  AUTOMATION_DIR: '{{.AUTOMATION_DIR | default "/openspace/automation"}}'
  LIFECYCLE_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/lifecycle-manager'
  BASEKIT_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/basekit'
  CLUSTERS_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/clusters'
  NODE_PREP_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/node_prep'
  ONBOARDER_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/onboarder'
  OPNSENSE_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/opnsense'
  VM_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/vm_management'

tasks:
  init:
    desc: "Generate + validate from deployment.yml"
    cmds:
      - task: _ensure-generated
      #- task: validate
      - task: nodeprep:ssh-timeout:relax

  validate:
    desc: "Validate deployment configuration for completeness and correctness"
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.LIFECYCLE_AUTOMATION_DIR}}/tasks/validate.yml"

  #--------------------------------------------------------------------------
  # Default Basekit Lifecycle
  #--------------------------------------------------------------------------
  default:basekit:deploy:
    desc: "Deploy base infrastructure (VMs, networking, OPNsense)"
    cmds:
      - task: init
      - task: nodeprep:run
        vars: 
          HOSTS: primary_management_host
      - task: opnsense:deploy
      - task: vm:mcm:deploy
      - task: vm:osms:deploy
      - task: cluster:mcm:deploy
      - task: cluster:osms:deploy
      - task: cluster:osdc:deploy

  #--------------------------------------------------------------------------
  # MCM Lifecycle Workflows
  #--------------------------------------------------------------------------
  cluster:mcm:deploy:
    desc: "Deploy Management Cluster (RKE2, Rancher, Harbor, GitOps)"
    cmds:
      - task: nodeprep:run
        vars:
          HOSTS: management_cluster
      - task: onboarder:prep
      - task: onboarder:rke2:deploy
      - task: onboarder:harbor:deploy
      - task: onboarder:rancher:deploy
      - task: onboarder:gitea:deploy
      - task: onboarder:argocd:deploy

  #cluster:mcm:destroy:
  #  desc: "Destroy Management Cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: management_cluster

  vm:mcm:deploy:
    desc: "Deploy Management Cluster VMs on Management KVM"
    vars:
      HOSTS: management_cluster
    cmds:
      - task: vms:libvirt:deploy

  #vm:mcm:destroy:
  #  desc: "Destroy Management Cluster VMs on Management KVM"
  #  vars:
  #    HOSTS: management_cluster
  #  cmds:
  #    - task: vms:libvirt:destroy

  kubeconfig:mcm:get:
    desc: "Retrieve MCM kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: mcm

  #--------------------------------------------------------------------------
  # OSMS Lifecycle Workflows
  #--------------------------------------------------------------------------
  cluster:osms:deploy:
    desc: "Deploy OpenSpace Management System cluster"
    cmds:
      - task: nodeprep:run
        vars:
          HOSTS: openspace_management_system
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms

  #cluster:osms:destroy:
  #  desc: "Destroy OpenSpace Management System cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: openspace_management_system

  vm:osms:deploy:
    desc: "Deploy OpenSpace Management System VMs on Management KVM"
    vars:
      HOSTS: openspace_management_system
    cmds:
      - task: vms:libvirt:deploy

  #vm:osms:destroy:
  #  desc: "Destroy OpenSpace Management System VMs on Management KVM"
  #  vars:
  #    HOSTS: openspace_management_system
  #  cmds:
  #    - task: vms:libvirt:destroy

  kubeconfig:osms:get:
    desc: "Retrieve OSMS kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osms

  #--------------------------------------------------------------------------
  # OSDC Lifecycle Workflows
  #--------------------------------------------------------------------------
  cluster:osdc:deploy:
    desc: "Deploy OpenSpace Data Cluster"
    cmds:
      - task: run-node-prep
        vars:
          HOSTS: openspace_datapath_cluster
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc
      - task: deploy-post-osdc
        vars:
          HOSTS: openspace_datapath_cluster

  #cluster:osdc:destroy:
  #  desc: "Destroy OpenSpace Data Cluster"
  #  cmds:
  #    - task: destroy-cluster
  #      vars:
  #        HOSTS: openspace_datapath_cluster

  kubeconfig:osms:get:
    desc: "Retrieve OSDC kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osdc

#============================================================================
# BUILDING BLOCKS - Composable tasks for custom workflows
#============================================================================

  #--------------------------------------------------------------------------
  # Node preparation internals
  #--------------------------------------------------------------------------
  nodeprep:run:
    desc: "Prepare target nodes (networking, nodeprep, ssh keys)"
    internal: true
    requires:
      vars: [HOSTS]
    vars:
      HOSTS: "{{.HOSTS}}"
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.NODE_PREP_AUTOMATION_DIR}}/main.yml"
          LIMIT: "{{.HOSTS}}"

  nodeprep:ssh-timeout:relax:
    desc: "Relax SSH timeout settings for Ansible runs"
    internal: true
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.NODE_PREP_AUTOMATION_DIR}}/tasks/ssh_timeouts.yml"
          TAGS: "relax"

  nodeprep:ssh-timeout:restore:
    desc: "Restore SSH timeout settings for Ansible runs"
    internal: true
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.NODE_PREP_AUTOMATION_DIR}}/tasks/ssh_timeouts.yml"
          TAGS: "restore"

  #--------------------------------------------------------------------------
  # Infrastructure internals
  #--------------------------------------------------------------------------
  opnsense:deploy:
    desc: Deploy OPNsense VM on Management KVM
    internal: true
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.OPNSENSE_AUTOMATION_DIR}}/tasks/main.yml"
      - >
        ssh
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        {{.SSH_USER}}@{{.MGMT_HOST}}
        'bash -s' < {{.OPNSENSE_AUTOMATION_DIR}}/scripts/deploy_opnsense.sh

  vms:libvirt:deploy:
    desc: Deploy VMs on Management KVM
    internal: true
    cmds:
      - task: _ansible-playbook 
        vars:
          PLAYBOOK: "{{.BASEKIT_AUTOMATION_DIR}}/tasks/deploy-vms.yml"

  #--------------------------------------------------------------------------
  # MCM internals
  #--------------------------------------------------------------------------
  onboarder:prep:
    desc: "Prepare Onboarder container environment based on Customer Success recommendations"
    internal: true
    cmds:
      - ansible-playbook -i {{.INVENTORY}} {{.ONBOARDER_AUTOMATION_DIR}}/tasks/prep_onboarder_container.yml

  onboarder:rke2:deploy:
    desc: "Deploy RKE2 on Management Cluster nodes"
    internal: true
    dir: /docker-workspace
    cmds:
      - make ansible-deploy-rke2-cluster ENVIRONMENT=install
      - make bootstrap-container-images-run ENVIRONMENT=install

  onboarder:harbor:deploy:
    desc: Deploy Harbor Registry
    internal: true
    dir: /docker-workspace
    cmds:
      - make helmfile-install HELMFILE_CHART=harbor ENVIRONMENT=install
      - make load-darksite-bundles ENVIRONMENT=install

  onboarder:rancher:deploy:
    desc: Deploy Rancher
    internal: true
    dir: /docker-workspace
    cmds:
      - make helmfile-install HELMFILE_CHART=rancher ENVIRONMENT=install
      - make terraform-rancher-bootstrap-apply ENVIRONMENT=install

  onboarder:gitea:deploy:
    desc: Deploy Gitea
    internal: true
    dir: /docker-workspace
    cmds:
      - make install-gitea ENVIRONMENT=install

  onboarder:argocd:deploy:
    desc: Deploy ArgoCD
    internal: true
    dir: /docker-workspace
    cmds:
      - make install-argocd ENVIRONMENT=install

  #--------------------------------------------------------------------------
  # Cluster internals
  #--------------------------------------------------------------------------

  deploy-downstream-cluster:
    desc: Deploy Downstream Cluster (OSMS or OSDC)
    internal: true
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.CLUSTERS_AUTOMATION_DIR}}/deploy_downstream_cluster.yml"
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"

  deploy-post-osdc:
    desc: "Post-OSDC deployment tasks"
    internal: true
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.CLUSTERS_AUTOMATION_DIR}}/post-osdc.yml"
          
  get-kubeconfig:
    desc: "Retrieve kubeconfig file"
    internal: true
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.CLUSTERS_AUTOMATION_DIR}}/get_kubeconfig.yml"
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"
        
  destroy-cluster:
    desc: "Destroy Cluster (MCM, OSMS, OSDC)"
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - task: _ansible-playbook
        vars:
          PLAYBOOK: "{{.CLUSTERS_AUTOMATION_DIR}}/destroy_cluster.yml"
          destroy_hosts: "{{.HOSTS}}"

#=============================================================================
# Internal Tasks (Utility/Helper Tasks)
#=============================================================================
  _ensure-generated:
    internal: true
    cmds:
      - >
        ansible-playbook
        -i localhost
        -c local
        {{.LIFECYCLE_AUTOMATION_DIR}}/tasks/generate_ansible.yml
        --extra-vars "config_path={{.DEPLOYMENT_FILE}}"
        --extra-vars "out_dir={{.ENV_DIR}}/generated"
        --extra-vars "templates_dir={{.LIFECYCLE_AUTOMATION_DIR}}/templates"
    status:
      - test -f {{.INVENTORY}}
      - test -d {{.GENERATED_DIR}}/host_vars
      - test -d {{.GENERATED_DIR}}/group_vars

  _ansible-playbook:
    internal: true
    deps: 
      - _ensure-generated
      - nodeprep:ssh-timeout:relax
    requires:
      vars: [PLAYBOOK]
    vars:
      LIMIT: '{{.LIMIT | default ""}}'
    cmds:
      - >
        ansible-playbook
        -i {{.INVENTORY}}
        {{.PLAYBOOK}}
        {{if .LIMIT}} --limit "{{.LIMIT}}" {{end}}
