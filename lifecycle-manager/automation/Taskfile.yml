version: '3'

vars:
  WORK_DIR: '{{.TASKFILE_DIR}}'                                          # Will generate all files local to this Taskfile
  DEPLOYMENT_FILE: '{{.TASKFILE_DIR}}/deployment.yml'                    # Path to deployment configuration file
  DATA_DIR: '{{.TASKFILE_DIR}}/data'                                     # Path to data directory (Ansible config, SSH keys, etc.)

  AUTOMATION_DIR: '/openspace/automation'
  LIFECYCLE_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/lifecycle-manager'
  BASEKIT_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/basekit'
  CLUSTERS_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/clusters'
  NODE_PREP_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/node_prep'
  ONBOARDER_AUTOMATION_DIR: '{{.AUTOMATION_DIR}}/onboarder'

tasks:
#============================================================================
# RECOMMENDED WORKFLOWS AND TASKS
#============================================================================
# These are complete, opinionated workflows for common use cases.
# You can use these as-is, or compose your own from the building blocks below.
# Recommended to compose your own Taskfile for custom workflows to avoid
# modifying the core lifecycle-manager Taskfile.

  #--------------------------------------------------------------------------
  # Initialization 
  # This is a mandatory first step before any deployment
  #--------------------------------------------------------------------------
  init:
    desc: "Initialize and validate deployment from deployment.toml"
    cmds:
      - task: generate-ansible-files
      - task: validate-prereqs

  #--------------------------------------------------------------------------
  # Basekit Lifecycle Workflows
  #--------------------------------------------------------------------------
  deploy-basekit:
    desc: "Deploy base infrastructure (VMs, networking, OPNsense)"
    vars:
      HOSTS: primary_management_host
    cmds:
      - task: configure-networking
      - task: configure-node
      - task: copy-ssh-key
      - task: configure-opnsense
      - task: copy-opnsense-config
      - task: deploy-opnsense-vm
      - task: deploy-vms
      - task: configure-vm-partitions

  #--------------------------------------------------------------------------
  # MCM Lifecycle Workflows
  #--------------------------------------------------------------------------
  deploy-mcm:
    desc: "Deploy Management Cluster (RKE2, Rancher, Harbor, GitOps)"
    cmds:
      - task: prep-onboarder-container
      - task: deploy-rke2-cluster
      - task: bootstrap-container-images
      - task: deploy-harbor
      - task: load-darksite-bundles
      - task: deploy-rancher
      - task: terraform-rancher
      - task: deploy-gitea
      - task: deploy-argocd

  destroy-mcm:
    desc: "Destroy Management Cluster"
    cmds:
      - task: destroy-cluster
        vars:
          HOSTS: management_cluster

  get-mcm-kubeconfig:
    desc: "Retrieve MCM kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: mcm

  #--------------------------------------------------------------------------
  # OSMS Lifecycle Workflows
  #--------------------------------------------------------------------------
  deploy-osms:
    desc: "Deploy OpenSpace Management System cluster"
    cmds:
      - python3 workflow_runner.py --start deploy-osms
      - task: run-node-prep
        vars:
          HOSTS: openspace_management_system
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms
      - python3 workflow_runner.py --complete deploy-osms

  destroy-osms:
    desc: "Destroy OpenSpace Management System cluster"
    cmds:
      - task: destroy-cluster
        vars:
          HOSTS: openspace_management_system

  get-osms-kubeconfig:
    desc: "Retrieve OSMS kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osms

  #--------------------------------------------------------------------------
  # OSDC Lifecycle Workflows
  #--------------------------------------------------------------------------
  deploy-osdc:
    desc: "Deploy OpenSpace Data Cluster"
    cmds:
      - python3 workflow_runner.py --start deploy-osdc
      - task: run-node-prep
        vars:
          HOSTS: openspace_datapath_cluster
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc
      - task: deploy-post-osdc
        vars:
          HOSTS: openspace_datapath_cluster
      - python3 workflow_runner.py --complete deploy-osdc

  destroy-osdc:
    desc: "Destroy OpenSpace Data Cluster"
    cmds:
      - task: destroy-cluster
        vars:
          HOSTS: openspace_datapath_cluster

  get-osdc-kubeconfig:
    desc: "Retrieve OSDC kubeconfig file"
    cmds:
      - task: get-kubeconfig
        vars:
          CLUSTER_TYPE: osdc













#============================================================================
# BUILDING BLOCKS - Composable tasks for custom workflows
#============================================================================
  
  #--------------------------------------------------------------------------
  # Initialization internals
  #--------------------------------------------------------------------------
  generate-ansible-files:
    desc: Generate ansible inventory and variable files from deployment config
    internal: true
    cmds:
      - >
        ansible-playbook
        -i localhost
        -c local
        {{.LIFECYCLE_AUTOMATION_DIR}}/tasks/generate_ansible.yml
        --extra-vars "config_path={{.DEPLOYMENT_FILE}}"
        --extra-vars "out_dir={{.WORK_DIR}}/generated"
        --extra-vars "templates_dir={{.LIFECYCLE_AUTOMATION_DIR}}/templates"
    status:
      - test -f {{.WORK_DIR}}/generated/inventory.ini
      - test -d {{.WORK_DIR}}/generated/host_vars
      - test -d {{.WORK_DIR}}/generated/group_vars

  validate-config:
    desc: "Validate deployment configuration for completeness and correctness"
    internal: true
    cmds:
      - ansible-playbook {{.ONBOARDER_AUTOMATION_DIR}}/validate.yml

  #--------------------------------------------------------------------------
  # Node preparation internals
  #--------------------------------------------------------------------------
  configure-networking:
    desc: Configure networking on Target Hosts
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - > 
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.NODE_PREP_AUTOMATION_DIR}}/configure-networking.yml
        --extra-vars "target_hosts={{.HOSTS}}"

  copy-ssh-key:
    desc: Copy SSH Key to Target Hosts
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - > 
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.NODE_PREP_AUTOMATION_DIR}}/copy_ssh_key.yml
        --extra-vars "target_hosts={{.HOSTS}}"

  configure-node:
    desc: Configure Target Hosts
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - > 
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.NODE_PREP_AUTOMATION_DIR}}/configure-node.yml
        --extra-vars "target_hosts={{.HOSTS}}"

  #--------------------------------------------------------------------------
  # Infrastructure internals
  #--------------------------------------------------------------------------
  configure-opnsense:
    desc: Generate OPNsense Configuration
    internal: true
    cmds:
      - > 
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.BASEKIT_AUTOMATION_DIR}}/configure-opnsense.yml
        --extra-vars "target_hosts=localhost"

  copy-opnsense-config:
    desc: Copy OPNsense Config to Management KVM
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.BASEKIT_AUTOMATION_DIR}}/copy-opnsense-config.yml
        --extra-vars "target_hosts={{.HOSTS}}"

  deploy-opnsense-vm:
    desc: Deploy OPNsense VM
    internal: true
    vars:
      SSH_USER:
        sh: yq '.ssh.user' {{env "OLM_WORK_DIR"}}/deployment.yml
      MGMT_HOST:
        sh: yq '.infrastructure.mgmt_kvm.wan_ip' {{env "OLM_WORK_DIR"}}/deployment.yml
    cmds:
      - ssh -t -o StrictHostKeyChecking=no -i {{env "ONBOARDER_CACHE_DIR"}}/rancher_ssh_key {{.SSH_USER}}@{{.MGMT_HOST}} 'sudo bash /var/lib/libvirt/config/vm_config/opnsense/install_opnsense.sh'

  deploy-vms:
    desc: Deploy VMs on Management KVM
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.BASEKIT_AUTOMATION_DIR}}/deploy-vms.yml
        --extra-vars "target_hosts={{.HOSTS}}"
          

  configure-vm-partitions:
    desc: Configure VM Disk Partitions
    internal: true
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.BASEKIT_AUTOMATION_DIR}}/configure-vm-partitions.yml
        --extra-vars "target_hosts=clusters" 

  #--------------------------------------------------------------------------
  # MCM internals
  #--------------------------------------------------------------------------
  prep-onboarder-container:
    desc: "Prepare Onboarder container environment based on Customer Success recommendations"
    internal: true
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.ONBOARDER_AUTOMATION_DIR}}/prep_onboarder_container.yml
        --extra-vars "target_hosts=localhost"

  deploy-rke2-cluster:
    desc: Deploy RKE2 Cluster
    internal: true
    cmds:
      - cd /docker-workspace && make ansible-deploy-rke2-cluster ENVIRONMENT=install

  bootstrap-container-images:
    desc: Bootstrap Container Images
    internal: true
    cmds:
      - cd /docker-workspace && make bootstrap-container-images-run ENVIRONMENT=install

  deploy-harbor:
    desc: Deploy Harbor Registry
    internal: true
    cmds:
      - cd /docker-workspace && make helmfile-install HELMFILE_CHART=harbor ENVIRONMENT=install

  load-darksite-bundles:
    desc: Load Darksite Bundles
    internal: true
    cmds:
      - cd /docker-workspace && make load-darksite-bundles ENVIRONMENT=install

  deploy-rancher:
    desc: Deploy Rancher
    internal: true
    cmds:
      - cd /docker-workspace && make helmfile-install HELMFILE_CHART=rancher ENVIRONMENT=install

  terraform-rancher:
    desc: Bootstrap Rancher with Terraform
    internal: true
    cmds:
      - cd /docker-workspace && make terraform-rancher-bootstrap-apply ENVIRONMENT=install

  deploy-gitea:
    desc: Deploy Gitea
    internal: true
    cmds:
      - cd /docker-workspace && make install-gitea ENVIRONMENT=install

  deploy-argocd:
    desc: Deploy ArgoCD
    internal: true
    cmds:
      - cd /docker-workspace && make install-argocd ENVIRONMENT=install

  #--------------------------------------------------------------------------
  # Cluster internals
  #--------------------------------------------------------------------------

  deploy-downstream-cluster:
    desc: Deploy Downstream Cluster (OSMS or OSDC)
    internal: true
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml 
        {{.CLUSTERS_AUTOMATION_DIR}}/deploy_downstream_cluster.yml
        --extra-vars "cluster_type={{.CLUSTER_TYPE}}"


  deploy-post-osdc:
    desc: "Post-OSDC deployment tasks"
    internal: true
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.CLUSTERS_AUTOMATION_DIR}}/post-osdc.yml
        --extra-vars "target_hosts=localhost"
          
  get-kubeconfig:
    desc: "Retrieve kubeconfig file"
    internal: true
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.CLUSTERS_AUTOMATION_DIR}}/get_kubeconfig.yml
        --extra-vars "target_hosts=localhost"
        --extra-vars "cluster_type={{.CLUSTER_TYPE}}"
          

  destroy-cluster:
    desc: "Destroy Cluster (MCM, OSMS, OSDC)"
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - >
        ansible-playbook
        -i {{.WORK_DIR}}/inventory.yml
        {{.CLUSTERS_AUTOMATION_DIR}}/destroy_cluster.yml
        --extra-vars "target_hosts=localhost"
        --extra-vars "destroy_hosts={{.HOSTS}}" 
          
