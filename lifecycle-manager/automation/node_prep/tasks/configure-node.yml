- name: Configure "{{ target_hosts }}"
  hosts: "{{ target_hosts }}"
  become: true

  vars:
    node_prep_templates_dir: "{{ lookup('env', 'OLM_NODE_PREP_TEMPLATES_DIR') }}"

  tasks:
#=============================================================================
# Common node configuration tasks for all nodes
#=============================================================================
    - name: Set Hostname
      ansible.builtin.hostname:
        name: "{{ (inventory_hostname | replace('_','-')) }}.{{ domain_name }}"

    - name: Update /etc/resolv.conf with customer DNS servers
      lineinfile:
        path: /etc/resolv.conf
        line: "nameserver {{ item }}"
        create: yes
        state: present
      loop: "{{ customer_dns_servers }}"

    - name: Create repo file
      copy:
        src: "{{ node_prep_templates_dir }}/kratos.repo"
        dest: /etc/yum.repos.d/kratos.repo
        owner: root
        group: root
        mode: "0644"
    
    - name: Configure chrony
      copy:
        dest: /etc/chrony.conf
        content: |
          server 192.168.2.1 iburst
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
        mode: '0644'

    - name: Enable and start chronyd
      systemd:
        name: chronyd
        enabled: yes
        state: started

#=============================================================================
# Management Host Basekit Configuration Only
#=============================================================================
    - name: Run Management Host Configuration Tasks
      include_tasks: management-host-basekit-tasks.yml
      when: "'mgmt_role_basekit' in group_names"
    
#=============================================================================
# MCM Node Configuration Only
#=============================================================================
    - name: Run MCM Node Configuration Tasks
      include_tasks: mcm-tasks.yml
      when: "'role_mcm' in group_names"
    
#=============================================================================
# OSMS Node Configuration Only
#============================================================================= 
    - name: Run OSMS Node Configuration Tasks
      include_tasks: osms-tasks.yml
      when: "'role_osms' in group_names"

#=============================================================================
# OSDC Node Configuration Only
#=============================================================================
    - name: Run OSDC Node Configuration Tasks
      include_tasks: osdc-tasks.yml
      when: "'role_osdc' in group_names"

#=============================================================================
# Cluster Node Configuration (Run on MCM, OSMS, and OSDC nodes)
#=============================================================================
    - name: Run Cluster Node Configuration Tasks
      include_tasks: cluster-tasks.yml
      when:
        - "'role_mcm' in group_names"
        - "'role_osms' in group_names"
        - "'role_osdc' in group_names"


