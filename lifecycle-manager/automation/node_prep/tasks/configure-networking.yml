- name: Configure host networking from host_vars (nmcli)
  hosts: "{{ target_hosts}}"
  become: true
  gather_facts: false

  vars:
    # Types you support; ordering matters for dependencies
    connection_type_order:
      - ethernet
      - bond
      - bridge
      - vlan

  tasks:
    - name: Preflight - require networks and networking.connections
      ansible.builtin.assert:
        that:
          - networks is defined
          - networking is defined
          - networking.connections is defined
        fail_msg: "host_vars must provide: networks and networking.connections"

    - name: Determine ssh path connection (from networks.* that you use to connect)
      ansible.builtin.set_fact:
        connect_via: "{{ networks.connect_via | default(omit) }}"
        ssh_conn: >-
          {{
            networks[networks.connect_via].attach_to
            if (networks.connect_via is defined and networks[networks.connect_via] is defined and networks[networks.connect_via].attach_to is defined)
            else omit
          }}

    - name: Build connections list
      ansible.builtin.set_fact:
        conn_list: "{{ networking.connections | dict2items }}"

    - name: Group connections by type
      ansible.builtin.set_fact:
        conns_by_type: "{{ conns_by_type | default({}) | combine({ item.value.type: (conns_by_type[item.value.type] | default([]) + [item]) }, recursive=True) }}"
      loop: "{{ conn_list }}"
      loop_control:
        label: "{{ item.key }} ({{ item.value.type }})"

    - name: Include per-type tasks in dependency order
      ansible.builtin.include_tasks: "./{{ item }}.yml"
      vars:
        connections: "{{ conns_by_type[item] | default([]) }}"
        networks_map: "{{ networks }}"
      loop: "{{ connection_type_order }}"
      when: (conns_by_type[item] | default([]) | length) > 0

    - name: Bring up all configured master connections
      ansible.builtin.command: "nmcli connection up {{ item.key }}"
      loop: "{{ conn_list }}"
      register: up_results
      changed_when: false
      failed_when: false

    - name: Active connection summary
      ansible.builtin.command: nmcli -f NAME,TYPE,DEVICE,STATE con show --active
      register: nmcli_active
      changed_when: false

    - name: Print active connections
      ansible.builtin.debug:
        var: nmcli_active.stdout_lines
