- name: Install required packages
  yum:
    name:
      - nfs-utils
      - chrony
      - make
      - tar
      - tuned
      - container-selinux
      - iscsi-initiator-utils
      - iptables
      - ipvsadm
      - bind-utils
      - bash-completion
    state: present
    disable_gpg_check: yes

- name: Configure sysctl settings for substrate
  copy:
    dest: /etc/sysctl.d/50-substrate.conf
    content: |
      fs.inotify.max_user_instances=12288
      fs.inotify.max_user_watches=524288
    mode: '0644'

- name: Ensure /etc/rancher/rke2/config.yaml.d directory exists
  file:
    path: /etc/rancher/rke2/config.yaml.d
    state: directory
    mode: '0755'

- name: Create 60-rancher.yaml
  copy:
    dest: /etc/rancher/rke2/config.yaml.d/60-rancher.yaml
    content: |
      {
      "system-default-registry": ""
      }
    mode: '0644'

- name: Configure kernel modules for KubeVirt
  copy:
    dest: /etc/modules-load.d/kube-virt.conf
    content: |
      ip_vs
      ip_vs_rr
    mode: '0644'

- name: Disable and stop firewalld
  systemd:
    name: firewalld
    enabled: no
    state: stopped

- name: Load ip_vs kernel module
  modprobe:
    name: ip_vs
    state: present

- name: Load ip_vs_rr kernel module
  modprobe:
    name: ip_vs_rr
    state: present

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false

- name: Create sudoers entry for openspace user
  copy:
    dest: /etc/sudoers.d/{{ ansible_user }}
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

# --------------------------------------------------------------------------
# Install rke2-selinux RPM from Onboarder
# --------------------------------------------------------------------------

- name: Copy RPM(s) from Onboarder to remote /tmp
  ansible.builtin.copy:
    src: "{{ lookup('env', 'OLM_DATA_DIR') }}/images/rke2-selinux.rpm"
    dest: "/tmp/rke2-selinux.rpm"
    mode: "0644"

- name: Install the copied RPM(s)
  ansible.builtin.yum:
    name: "/tmp/rke2-selinux.rpm"
    state: present
    disable_gpg_check: true


#=============================================================================
# Bootstrap SSH Key to Target Hosts
#=============================================================================

- name: Set SSH bootstrap vars
  set_fact:
    target_user: "{{ ansible_user }}"
    cache_dir: "{{ lookup('env', 'ONBOARDER_CACHE_DIR') }}"
    ssh_pubkey_path: "{{ lookup('env', 'ONBOARDER_CACHE_DIR') }}/rancher_ssh_key.pub"

- name: Validate that ssh_pubkey_path exists (on localhost)
  stat:
    path: "{{ ssh_pubkey_path }}"
  delegate_to: localhost
  run_once: true
  register: pub_stat
  changed_when: false

- name: Fail if ssh_pubkey_path does not exist
  fail:
    msg: "Public key file not found at {{ ssh_pubkey_path }}"
  when: not pub_stat.stat.exists
  delegate_to: localhost
  run_once: true

- name: Read public key content (from localhost)
  slurp:
    src: "{{ ssh_pubkey_path }}"
  delegate_to: localhost
  run_once: true
  register: pubkey_content

- name: Ensure ~/.ssh directory exists on target
  file:
    path: "/home/{{ target_user }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: true

- name: Add public key to authorized_keys
  authorized_key:
    user: "{{ target_user }}"
    state: present
    key: "{{ pubkey_content.content | b64decode | trim }}"
  become: true

- name: Test connectivity after key is installed
  ping:
