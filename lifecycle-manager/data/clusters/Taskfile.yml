# openspace/data/clusters/Taskfile.yml
version: '3'

vars:
  TASK_EXECUTER: '{{env "OLM_DATA_DIR"}}/run_task.py'
  TASK_FILE_DIR: '{{env "OLM_CLUSTERS_TASK_DIR"}}'

tasks:
#=================================================================================#
# Downstream Cluster Deployment  Main Task                                        #
#=================================================================================#
  deploy-downstream-cluster:
    desc: Deploy Downstream Cluster (OSMS or OSDC)
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - python3 {{.TASK_EXECUTER}} 
          --task-id=deploy-{{.CLUSTER_TYPE}}-cluster
          --kind=ansible
          --file={{.TASK_FILE_DIR}}/deploy_downstream_cluster.yml
          --args="-e cluster_type={{.CLUSTER_TYPE}}"

#=================================================================================#
# Downstream Cluster Deployment  Minor Tasks                                      #
#=================================================================================#
  deploy-post-osdc:
    desc: "Post-OSDC deployment tasks"
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{.TASK_EXECUTER}}
          --task-id=deploy-post-osdc-{{.HOSTS}}
          --hosts=localhost
          --file={{.TASK_FILE_DIR}}/post-osdc.yml
          --kind=ansible

  get-kubeconfig:
    desc: "Retrieve kubeconfig file"
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - python3 {{.TASK_EXECUTER}} 
          --task-id=get-kubeconfig-{{.CLUSTER_TYPE}}
          --hosts=localhost
          --file={{.TASK_FILE_DIR}}/get_kubeconfig.yml
          --kind=ansible