# openspace/data/taskfiles/onboarder.yml
version: '3'

tasks:
#=================================================================================#
# Onboarder Initializtion and Validation                                          #
#=================================================================================#
  init:
    desc: "Initialize Onboarder Environment"
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=onboarder-init 
          --hosts=localhost 
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/init.yml 
          --kind=ansible

  validate:
    desc: "Validate Onboarder Configuration"
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=onboarder-validate 
          --hosts=localhost 
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/validate.yml 
          --kind=ansible

#=================================================================================#
# Cluster Deployment                                                              #
#=================================================================================#
  deploy-mcm:
    desc: Deploy MCM Cluster
    requires:
      vars: [HOSTS]
    cmds:
      - task: copy-ssh-key
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: run-node-prep
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: run-onboarder

  deploy-osms:
    desc: Deploy OSMS Cluster
    requires:
      vars: [HOSTS]
    cmds:
      - task: copy-ssh-key
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: run-node-prep
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms

  deploy-osdc:
    desc: Deploy OSDC Cluster
    requires:
      vars: [HOSTS]
    cmds:
      - task: copy-ssh-key
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: run-node-prep
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc

  deploy-post-osdc:
    desc: "Post-OSDC deployment tasks"
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py
          --task-id=deploy-post-osdc-{{.HOSTS}}
          --hosts=localhost
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/post-osdc.yml
          --kind=ansible

  deploy-downstream-cluster:
    desc: Deploy Downstream Cluster (OSMS or OSDC)
    requires:
      vars: [CLUSTER_TYPE]
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-{{.CLUSTER_TYPE}}-cluster
          --kind=ansible
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/deploy_downstream_cluster.yml
          --args="-e cluster_type={{.CLUSTER_TYPE}}"

#=================================================================================#
# Node Prep                                                                       #
#=================================================================================#
  copy-ssh-key:
    desc: Copy SSH Key to Target Hosts
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py
          --task-id=copy-ssh-key-{{.HOSTS}}
          --hosts={{.HOSTS}}
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/copy_ssh_key.yml
          --kind=ansible

  node-prep:
    desc: Cluster Node Prep
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=configure-node-{{.HOSTS}} 
          --hosts={{.HOSTS}} 
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/configure-node.yml 
          --kind=ansible

  install-rke2-selinux:
    desc: Install RKE2 SELinux Package
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=install-rke2-selinux-{{.HOSTS}} 
          --hosts={{.HOSTS}} 
          --file={{env "ONBOARDER_WORK_DIR"}}/tasks/install_rke2-selinux.yml 
          --kind=ansible

  run-node-prep:
    desc: Run All Node Prep Tasks
    requires:
      vars: [HOSTS]
    cmds:
      - task: node-prep
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: install-rke2-selinux
        vars:
          HOSTS: '{{.HOSTS}}'

#=================================================================================#
# Onboarder Tasks                                                                 #
#=================================================================================#
  run-onboarder:
    desc: Run all Onboarder deployment steps
    cmds:
      - task: deploy-rke2-cluster
      - task: bootstrap-container-images
      - task: deploy-harbor
      - task: load-darksite-bundles
      - task: deploy-rancher
      - task: terraform-rancher
      - task: deploy-gitea
      - task: deploy-argocd

  onboarder-prep:
    desc: Prepare Onboarder Environment
    cmds:
      - task: prep-onboarder-container

  prep-onboarder-container:
    desc: Prep Onboarder Container
    vars:
      HOSTS: localhost
      FILE: './tasks/prep_onboarder_container.yml'
      KIND: ansible
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py --task-id=prep-onboarder-container --hosts={{.HOSTS}} --file={{.FILE}} --kind={{.KIND}}

  deploy-rke2-cluster:
    desc: Deploy RKE2 Cluster
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-rke2-cluster 
          --kind=shell 
          --command="cd /docker-workspace && make ansible-deploy-rke2-cluster ENVIRONMENT=install"

  bootstrap-container-images:
    desc: Bootstrap Container Images
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=bootstrap-container-images 
          --kind=shell 
          --command="cd /docker-workspace && make bootstrap-container-images-run ENVIRONMENT=install"

  deploy-harbor:
    desc: Deploy Harbor Registry
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-harbor 
          --kind=shell 
          --command="cd /docker-workspace && make helmfile-install HELMFILE_CHART=harbor ENVIRONMENT=install"

  load-darksite-bundles:
    desc: Load Darksite Bundles
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=load-darksite-bundles 
          --kind=shell 
          --command="cd /docker-workspace && make load-darksite-bundles ENVIRONMENT=install"

  deploy-rancher:
    desc: Deploy Rancher
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-rancher 
          --kind=shell 
          --command="cd /docker-workspace && make helmfile-install HELMFILE_CHART=rancher ENVIRONMENT=install"

  terraform-rancher:
    desc: Bootstrap Rancher with Terraform
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=terraform-rancher 
          --kind=shell 
          --command="cd /docker-workspace && make terraform-rancher-bootstrap-apply ENVIRONMENT=install"

  deploy-gitea:
    desc: Deploy Gitea
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-gitea 
          --kind=shell 
          --command="cd /docker-workspace && make install-gitea ENVIRONMENT=install"

  deploy-argocd:
    desc: Deploy ArgoCD
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-argocd 
          --kind=shell 
          --command="cd /docker-workspace && make install-argocd ENVIRONMENT=install"

  # ============================================================================
  # Kubeconfig Tasks
  # ============================================================================
  get-kubeconfig-mcm:
    desc: "Retrieve MCM kubeconfig file"
    cmds:
      - task: common:get-infrastructure-kubeconfig
        vars:
          HOSTS: management_cluster

  get-kubeconfig-osms:
    desc: "Retrieve OSMS kubeconfig file"
    cmds:
      - task: common:get-downstream-kubeconfig
        vars:
          INFRASTRUCTURE_KUBECONFIG: '{{ install_dir }}/kubeconfigs/mcm_kubeconfig.yaml'

  get-kubeconfig-osdc:
    desc: "Retrieve OSDC kubeconfig file"
    cmds:
      - task: common:get-downstream-kubeconfig
        vars:
          INFRASTRUCTURE_KUBECONFIG: '{{ install_dir }}/kubeconfigs/mcm_kubeconfig.yaml'