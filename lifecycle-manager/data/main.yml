# openspace/main.yml
version: '3'

includes:
  clusters:
    taskfile: '{{env "OLM_CLUSTERS_TASKFILE"}}'
  custom:
    taskfile: '{{env "OLM_CUSTOM_TASKFILE"}}'
  node-prep:
    taskfile: '{{env "OLM_NODE_PREP_TASKFILE"}}'
  infra-basekit:
    taskfile: '{{env "OLM_BASEKIT_TASKFILE"}}'
  onboarder:
    taskfile: '{{env "OLM_ONBOARDER_TASKFILE"}}'

tasks:
  #============================================================================
  # Initialization
  #============================================================================
  init:
    desc: "Initialize deployment from deployment.yml"
    cmds:
      - task: onboarder:init

  validate:
    desc: "Validate deployment configuration"
    cmds:
      - task: onboarder:validate

  #============================================================================
  # Infrastructure Deployment
  #============================================================================
  deploy-infra-basekit:
    desc: "Deploy basekit infrastructure (VMs/network)"
    cmds:
      - task: infra-basekit:deploy-all

  destroy-infra-basekit:
    desc: "Destroy basekit infrastructure"
    cmds:
      - task: infra-basekit:destroy-all

  #============================================================================
  # Management Cluster Module (MCM) - via Onboarder
  #============================================================================
  deploy-mcm:
    desc: "Deploy Management Cluster (Rancher, Harbor, Gitea, ArgoCD)"
    cmds:
      - task: node-prep:run-node-prep
        vars:
          HOSTS: management_cluster
      - task: onboarder:run-onboarder

  destroy-mcm:
    desc: "Destroy Management Cluster"
    cmds:
      - task: onboarder:destroy-mcm

  get-kubeconfig-mcm:
    desc: "Retrieve MCM kubeconfig"
    cmds:
      - task: onboarder:get-kubeconfig

  #============================================================================
  # OpenSpace Management System (OSMS)
  #============================================================================
  deploy-osms:
    desc: "Deploy OpenSpace Management System"
    cmds:
      - task: node-prep:run-node-prep
        vars:
          HOSTS: openspace_management_system
      - task: clusters:deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms

  destroy-osms:
    desc: "Destroy OSMS"
    cmds:
      - task: clusters:destroy-downstream-cluster
        vars:
          CLUSTER_TYPE: osms

  get-kubeconfig-osms:
    desc: "Retrieve OSMS kubeconfig"
    cmds:
      - task: clusters:get-kubeconfig
        vars:
          CLUSTER_TYPE: osms

  #============================================================================
  # OpenSpace Data Cluster (OSDC)
  #============================================================================
  deploy-osdc:
    desc: "Deploy OpenSpace Data Cluster"
    cmds:
      - task: node-prep:run-node-prep
        vars:
          HOSTS: openspace_data_cluster
      - task: clusters:deploy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc

  deploy-post-osdc:
    desc: "Run post-deployment tasks for OSDC"
    cmds:
      - task: clusters:deploy-post-osdc
        vars:
          HOSTS: openspace_data_cluster

  destroy-osdc:
    desc: "Destroy OSDC"
    cmds:
      - task: clusters:destroy-downstream-cluster
        vars:
          CLUSTER_TYPE: osdc

  get-kubeconfig-osdc:
    desc: "Retrieve OSDC kubeconfig"
    cmds:
      - task: clusters:get-kubeconfig
        vars:
          CLUSTER_TYPE: osdc

  #============================================================================
  # Full Deployment
  #============================================================================
  deploy-all:
    desc: "Deploy complete platform (Infra → MCM → OSMS → OSDC)"
    cmds:
      - task: deploy-infra
      - task: deploy-mcm
      - task: deploy-osms
      - task: deploy-osdc
      - echo "✓ Complete platform deployment finished"

  #============================================================================
  # Status & Monitoring
  #============================================================================
  status:
    desc: "Check deployment status"
    cmds:
      - ansible-playbook {{env "OLM_DATA_DIR"}}/playbooks/check_status.yml
        -e shared_dir={{.SHARED_DIR}}

  logs:
    desc: "Show recent task logs"
    cmds:
      - |
        if [ -f {{.CACHE_DIR}}/state.json ]; then
          cat {{.CACHE_DIR}}/state.json | jq -r '.tasks | to_entries | .[-10:] | .[] | "\(.key): \(.value.status)"'
        else
          echo "No state file found"
        fi

  #============================================================================
  # Updates
  #============================================================================
  update-quarterly:
    desc: "Run quarterly system updates"
    cmds:
      - echo "Running quarterly updates..."
      - ansible-playbook {{env "OLM_DATA_DIR"}}/playbooks/update_quarterly.yml
        -e deployment_file={{.DEPLOYMENT_FILE}}
        -e shared_dir={{.SHARED_DIR}}

  #============================================================================
  # Utilities
  #============================================================================
  clean-cache:
    desc: "Clean cache directory"
    cmds:
      - rm -rf {{.CACHE_DIR}}/*
      - echo "✓ Cache cleaned"

  list:
    desc: "List all available tasks"
    cmds:
      - task --list-all

  default:
    cmds:
      - task --list