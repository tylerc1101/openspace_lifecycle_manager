version: '3'

tasks:
#=================================================================================#
# Basekit  Main Task
#=================================================================================#
  deploy-basekit-infrastructure:
    desc: Deploy All Basekit Components
    cmds:
      - task: bootstrap-mgmt-kvm
      - task: configure-opnsense
      - task: copy-opnsense-config
      - task: deploy-opnsense-vm
      - task: deploy-vms
      - task: configure-vm-partitions
  
#=================================================================================#
# Basekit  Minor Task
#=================================================================================# 
  bootstrap-mgmt-kvm:
    desc: Bootstrap Management KVM Server
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=bootstrap-mgmt-kvm 
          --hosts=mgmt_kvm 
          --file={{env "OLM_BASEKIT_TASK_DIR"}}/bootstrap-mgmt-kvm.yml 
          --kind=ansible

  configure-opnsense:
    desc: Generate OPNsense Configuration
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=configure-opnsense 
          --hosts=localhost 
          --file={{env "OLM_BASEKIT_TASK_DIR"}}/configure-opnsense.yml 
          --kind=ansible

  copy-opnsense-config:
    desc: Copy OPNsense Config to Management KVM
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=copy-opnsense-config 
          --hosts=mgmt_kvm 
          --file={{env "OLM_BASEKIT_TASK_DIR"}}/copy-opnsense-config.yml 
          --kind=ansible

  deploy-opnsense-vm:
    desc: Deploy OPNsense VM
    vars:
      SSH_USER:
        sh: yq '.ssh.user' {{env "OLM_INSTALL_DIR"}}/deployment.yml
      MGMT_HOST:
        sh: yq '.infrastructure.mgmt_kvm.wan_ip' {{env "OLM_INSTALL_DIR"}}/deployment.yml
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-opnsense-vm 
          --kind=shell 
          --command="ssh -t -o StrictHostKeyChecking=no -i {{env "ONBOARDER_CACHE_DIR"}}/rancher_ssh_key {{.SSH_USER}}@{{.MGMT_HOST}} 'sudo bash /var/lib/libvirt/config/vm_config/opnsense/install_opnsense.sh'"

  deploy-vms:
    desc: Deploy VMs on Management KVM
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=deploy-vms 
          --hosts=mgmt_kvm 
          --file={{env "OLM_BASEKIT_TASK_DIR"}}/deploy-vms.yml 
          --kind=ansible

  configure-vm-partitions:
    desc: Configure VM Disk Partitions
    cmds:
      - python3 {{env "OLM_DATA_DIR"}}/run_task.py 
          --task-id=configure-vm-partitions 
          --hosts=clusters 
          --file={{env "OLM_BASEKIT_TASK_DIR"}}/configure-vm-partitions.yml 
          --kind=ansible
