# openspace/data/node_prep/Taskfile.yml
version: '3'

vars:
  TASK_EXECUTER: '{{env "OLM_DATA_DIR"}}/run_task.py'
  TASK_FILE_DIR: '{{env "OLM_NODE_PREP_TASK_DIR"}}'

tasks:
#=================================================================================#
# Node Preparation  Main Task
#=================================================================================#
  run-node-prep:
    desc: "Run node preparation tasks on target hosts"
    requires:
      vars: [HOSTS]
    cmds:
      - task: copy-ssh-key
        vars:
          HOSTS: '{{.HOSTS}}'
      - task: prep-nodes
        vars:
          HOSTS: '{{.HOSTS}}'

#=================================================================================#
# Node Preparation  Minor Tasks
#=================================================================================#
  copy-ssh-key:
    desc: Copy SSH Key to Target Hosts
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{.TASK_EXECUTER}}
          --task-id=copy-ssh-key-{{.HOSTS}}
          --hosts={{.HOSTS}}
          --file={{.TASK_FILE_DIR}}/copy_ssh_key.yml
          --kind=ansible

  prep-nodes:
    desc: Cluster Node Prep
    requires:
      vars: [HOSTS]
    cmds:
      - python3 {{.TASK_EXECUTER}}
          --task-id=configure-node-{{.HOSTS}} 
          --hosts={{.HOSTS}} 
          --file={{.TASK_FILE_DIR}}/configure-node.yml 
          --kind=ansible