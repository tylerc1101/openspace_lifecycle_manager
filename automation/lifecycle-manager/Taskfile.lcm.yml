version: '3'

vars:
  TASKS_DIR: "{{.ROOT_DIR}}/tasks"
  ANSIBLE_CFG: "{{.ROOT_DIR}}/ansible.cfg"
  OPENSPACE_ROOT: '{{ env "OPENSPACE_ROOT" | default "/opt/openspace" }}'
  DEPLOYMENT_FILE: "{{.OPENSPACE_ROOT}}/env/current/deployment.yml"

tasks:
  Env:Init:
    desc: "Initialize environment for lifecycle management tasks"
    cmds:
      - task: banner
        vars:
          MESSAGE: "🚀 STEP: Initialize Lifecycle Management Environment"
      - ansible-playbook -i {{.DEPLOYMENT_FILE}} {{.TASKS_DIR}}/init.yml

  Env:Validate:
    desc: "Validate deployment configuration for completeness and correctness"
    cmds:
      - task: banner
        vars:
          MESSAGE: "🔍 STEP: Validate Deployment Configuration"
      - ansible-playbook -i {{.DEPLOYMENT_FILE}} {{.TASKS_DIR}}/validate.yml

  SSH_Timeout:No_SSH_Timeout:
    desc: "Disable SSH timeout on management hosts to prevent disconnections during long-running tasks"
    cmds:
      - task: banner
        vars:
          MESSAGE: "⏳ STEP: Disable SSH Timeout on Management Hosts"
      - ansible-playbook -i {{.DEPLOYMENT_FILE}} {{.TASKS_DIR}}/ssh_timeout.yml --extra-vars "enable_timeout=false"

  SSH_Timeout:Enable_SSH_Timeout:
    desc: "Re-enable SSH timeout on management hosts after tasks are complete"
    cmds:
      - task: banner
        vars:
          MESSAGE: "⏳ STEP: Re-enable SSH Timeout on Management Hosts"
      - ansible-playbook -i {{.DEPLOYMENT_FILE}} {{.TASKS_DIR}}/ssh_timeout.yml --extra-vars "enable_timeout=true"

  Updates:Check_For_Updates:
    desc: "Check for updates to lifecycle management playbooks and scripts"
    cmds:
      - task: banner
        vars:
          MESSAGE: "🔄 STEP: Check for Updates to Lifecycle Management Playbooks and Scripts"
      - ansible-playbook -i {{.DEPLOYMENT_FILE}} {{.TASKS_DIR}}/check_updates.yml

  banner:
    internal: true
    silent: true
    cmds:
      - |
        echo ""
        echo -e "\033[1;34m===================================================="
        echo -e "  {{.MESSAGE}}"
        echo -e "====================================================\033[0m"
        echo ""

  ansible-ping:
    desc: "Test connectivity to target hosts with Ansible ping"
    internal: true
    requires:
      vars: [HOSTS]
    cmds:
      - ansible -i {{.DEPLOYMENT_FILE}} {{.HOSTS}} -m ping

  ansible-playbook:
    internal: true
    requires:
      vars: [PLAYBOOK]
    vars:
      LIMIT: '{{.LIMIT | default ""}}'
      TAGS: '{{.TAGS | default ""}}'
      SKIP_TAGS: '{{.SKIP_TAGS | default ""}}'
      EXTRA_VARS: '{{.EXTRA_VARS | default ""}}'
    cmds:
      - >
        ANSIBLE_CONFIG={{.ANSIBLE_CFG}}
        ansible-playbook
        -i {{.DEPLOYMENT_FILE}}
        {{.PLAYBOOK}}
        {{if .LIMIT}} --limit "{{.LIMIT}}" {{end}}
        {{if .TAGS}} --tags "{{.TAGS}}" {{end}}
        {{if .SKIP_TAGS}} --skip-tags "{{.SKIP_TAGS}}" {{end}}
        {{if .EXTRA_VARS}} --extra-vars '{{.EXTRA_VARS}}' {{end}}

  ansible-vault-passfile:
    internal: true
    desc: Prompt for Ansible Vault password once and store in a per-run temp file
    cmds:
      - |
        set -euo pipefail
  
        PASSFILE="{{.TASK_TEMP_DIR}}/ansible_vault_pass"
  
        # If already created in this run, don't prompt again
        if [ -s "$PASSFILE" ]; then
          exit 0
        fi

        mkdir -p "{{.TASK_TEMP_DIR}}"
        umask 077

        printf "Ansible Vault password: " >&2
        stty -echo
        read -r VAULT_PASS
        stty echo
        printf "\n" >&2

        printf "%s\n" "$VAULT_PASS" > "$PASSFILE"
        unset VAULT_PASS

        chmod 600 "$PASSFILE"