    kubernetes.io/hostname: osdc1.base-kit-3.kratos
  resourceName: intelnics
  mtu: 9000
  numVfs: 64
  nicSelector:
    deviceID: "1593"
    vendor: "8086"
    rootDevices:
    - "0000:0d:00.3"
    - "0000:22:00.3"
  deviceType: netdevice