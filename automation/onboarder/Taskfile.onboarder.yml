version: '3'

vars:
  TASKS_DIR: "{{.ROOT_DIR}}/tasks"

includes:
  lcm:
    taskfile: ../lifecycle-manager/Taskfile.lcm.yml
    internal: true

  Onboarder_Internals:
    taskfile: "{{.TASKS_DIR}}/{{.ONBOARDER_VERSION}}/Taskfile.{{.ONBOARDER_VERSION}}.yml"

tasks:
  Deploy:
    desc: "Deploy full MCM stack (RKE2, Harbor, Rancher, Gitea, ArgoCD)"
    cmds:
      - task: Image:Load
      - task: Container:Run
      - task: Container:Prep
      - task: Onboarder_Internals:Deploy


  Image:Load:
    desc: "Load onboarder container image into host registry"
    cmds:
      - task: lcm:banner
        vars:
          MESSAGE: "🚀 Load Onboarder image into host registry"
      - task: lcm:ansible-playbook
        vars:
          PLAYBOOK: "{{.TASKS_DIR}}/main.onboarder.yml"
          TAGS: "load"


  Container:Run:
    desc: "Run onboarder container"
    cmds:
      - task: lcm:banner
        vars:
          MESSAGE: "🚀 Run Onboarder container"
      - task: lcm:ansible-playbook
        vars:
          PLAYBOOK: "{{.TASKS_DIR}}/main.onboarder.yml"
          TAGS: "run"

  Container:Start:
    desc: "Start onboarder container if not already running"
    cmds:
      - task: lcm:banner
        vars:
          MESSAGE: "🚀 Start Onboarder container if not already running"
      - task: lcm:ansible-playbook
        vars:
          PLAYBOOK: "{{.TASKS_DIR}}/main.onboarder.yml"
          TAGS: "start"


  Container:Prep:
    desc: "Prepare onboarder container (configs, files, env)"
    cmds:
      - task: lcm:banner
        vars:
          MESSAGE: "🚀 Prepare Onboarder container"
      - task: lcm:ansible-playbook
        vars:
          PLAYBOOK: "{{.TASKS_DIR}}/{{.ONBOARDER_VERSION}}/prep.yml"