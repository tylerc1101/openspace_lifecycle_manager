version: '3'

vars:
  TASKS_DIR: "{{.ROOT_DIR}}/tasks"

includes:
  LifeCycle-Manager:
    taskfile: ../lifecycle-manager/Taskfile.lcm.yml
    internal: true

tasks:
  Deploy:Onboarder_Container:
    desc: "Deploy Onboarder container to MGMT host"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Deploy Onboarder container to MGMT host"
      - task: LifeCycle-Manager:ansible-playbook
        vars:
          PLAYBOOK: "{{.TASKS_DIR}}/deploy_onboarder_container.yml"
  
  Run_All_Makes:
    desc: "Run all Make commands in the Onboarder Container to deploy the MCM cluster"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Run all Make commands in Onboarder container to deploy MCM cluster"
      - task: Deploy:RKE2
      - task: Deploy:Harbor
      - task: Deploy:Rancher
      - task: Deploy:Gitea
      - task: Deploy:ArgoCD

  Deploy:RKE2:
    desc: "Deploy RKE2 Kubernetes cluster using Onboarder container"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Deploy RKE2 Kubernetes cluster using Onboarder container"
      - task: Make:Ansible_Deploy_RKE2_Cluster
      - task: Make:Bootstrap_Container_Images_Run
  
  Deploy:Harbor:
    desc: "Deploy Harbor container registry using Onboarder container"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Deploy Harbor container registry using Onboarder container"
      - task: Make:Helmfile_Install_Harbor
      - task: Make:Load_Darksite_Bundles

  Deploy:Rancher:
    desc: "Deploy Rancher management platform using Onboarder container"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Deploy Rancher management platform using Onboarder container"
      - task: Make:Helmfile_Install_Rancher
      - task: Make:Terraform_Rancher_Bootstrap_Apply

  Deploy:Gitea:
    desc: "Deploy Gitea Git server using Onboarder container"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Deploy Gitea Git server using Onboarder container"
      - task: Make:Install_Gitea

  Deploy:ArgoCD:
    desc: "Deploy ArgoCD GitOps platform using Onboarder container"
    cmds:
      - task: LifeCycle-Manager:banner
        vars:
          MESSAGE: "🚀 STEP: Deploy ArgoCD GitOps platform using Onboarder container"
      - task: Make:Install_ArgoCD

  Make:Ansible_Deploy_RKE2_Cluster:
    desc: "Run Onboarder Make command to deploy RKE2 to MCM hosts"
    cmds:
      - make something

  Make:Bootstrap_Container_Images_Run:
    desc: "Run Onboarder Make command to push images to MCM hosts"
    cmds:
      - make something

  Make:Helmfile_Install_Harbor:
    desc: "Run Onboarder Make command to deploy Harbor with Helmfile"
    cmds:
      - make something

  Make:Load_Darksite_Bundles:
    desc: "Run Onboarder Make command to load all offline images into Harbor"
    cmd:
      - make something

  Make:Helmfile_Install_Rancher:
    desc: "Run Onboarder Make command to deploy Rancher with Helmfile"
    cmds:
      - make something

  Make:Terraform_Rancher_Bootstrap_Apply:
    desc: "Run Onboarder Make command to apply Terraform bootstrap for Rancher"
    cmds:
      - make something

  Make:Install_Gitea:
    desc: "Run Onboarder Make command to deploy Gitea Git server"
    cmds:
      - make something

  Make:Install_ArgoCD:
    desc: "Run Onboarder Make command to deploy ArgoCD GitOps platform"
    cmds:
      - make something