- name: Configure "{{ target_hosts }}"
  hosts: all
  become: true

  tasks:
#=============================================================================
# Common node configuration tasks for all nodes
#=============================================================================
    - name: Set Hostname
      ansible.builtin.hostname:
        name: "{{ (inventory_hostname | replace('_','-')) }}.{{ site.domain_name }}"

    - name: Update /etc/resolv.conf with customer DNS servers
      lineinfile:
        path: /etc/resolv.conf
        line: "nameserver {{ item }}"
        create: yes
        state: present
      loop: "{{ networks.customer.dns_servers }}"

    - name: Create repo file
      copy:
        src: "../templates/kratos.repo"
        dest: /etc/yum.repos.d/kratos.repo
        owner: root
        group: root
        mode: "0644"
    
    - name: Configure chrony
      copy:
        dest: /etc/chrony.conf
        content: |
          server 192.168.2.1 iburst
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
        mode: '0644'

    - name: Enable and start chronyd
      systemd:
        name: chronyd
        enabled: yes
        state: started

#=============================================================================
# Management Node Configuration Only
#=============================================================================
    - name: Run Management Node Configuration Tasks
      include_tasks: mgmt-tasks.yml
      when: "'management' in group_names"

    - name: Install Cockpit on Management Server
      block:
        - name: Install required cockpit packages
          ansible.builtin.yum:
            name:
              - "@Headless Management"
              - cockpit
              - cockpit-machines
            state: present
            disable_gpg_check: yes

        - name: Ensure cockpit socket started/enabled (don't fail if unit missing)
          ansible.builtin.systemd:
            name: cockpit.socket
            state: started
            enabled: true
          failed_when: false
      when: install_cockpit | default(false)

    - name: Libvirt setup
      block:
        - name: Install required libvirt/virtualization packages
          ansible.builtin.yum:
            name:
              - "@Virtualization Platform"
              - "@Development Tools"
              - virt-install
              - qemu-img
              - libcdio
              - libguestfs
              - libguestfs-tools
              - guestfs-tools
              - gcc
              - openssl-devel
              - libffi-devel
              - zlib-devel
              - xz-devel
              - readline-devel
            state: present
            disable_gpg_check: yes

        - name: Ensure libvirt daemon started/enabled (don't fail if unit missing)
          ansible.builtin.systemd:
            name: libvirtd
            state: started
            enabled: true
          failed_when: false
      when: install_libvirt | default(false)

#=============================================================================
# MCM Node Configuration Only
#=============================================================================
    - name: Run MCM Node Configuration Tasks
      include_tasks: mcm-tasks.yml
      when: "'mcm-clusters' in group_names"
    
#=============================================================================
# OSMS Node Configuration Only
#============================================================================= 
    - name: Run OSMS Node Configuration Tasks
      include_tasks: osms-tasks.yml
      when: "'osms-clusters' in group_names"

#=============================================================================
# OSDC Node Configuration Only
#=============================================================================
    - name: Run OSDC Node Configuration Tasks
      include_tasks: osdc-tasks.yml
      when: "'osdc-clusters' in group_names"

#=============================================================================
# Cluster Node Configuration (Run on MCM, OSMS, and OSDC nodes)
#=============================================================================
    - name: Run Cluster Node Configuration Tasks
      include_tasks: cluster-tasks.yml
      when: cluster_type is defined and cluster_type in ['mcm', 'osms', 'osdc']


